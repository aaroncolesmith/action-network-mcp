[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "action-network-mcp"
version = "0.1.0"
description = "Live Action Network odds for agents: Python client, REST/OpenAPI, MCP, and CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "mcp>=2.3,<3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
action-network = "action_network.__main__:main"
action-network-mcp = "action_network.mcp_server:main"

[tool.setuptools]
packages = ["action_network"]

[tool.pytest.ini_options]
testpaths = ["tests"]
