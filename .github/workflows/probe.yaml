name: probe api

# Developer tool: inspect raw Action Network responses. Results appear as run annotations.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated API paths, e.g. scoreboard/nfl?week=7"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - env:
          PATHS: ${{ inputs.paths }}
        run: python -m action_network.probe --annotate $PATHS
