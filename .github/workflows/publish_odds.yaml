name: publish odds

on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-odds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AN_SCOREBOARD_TTL: "900"       # soccer competitions share one fetch per date
      AN_SNAPSHOT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Check sportsbook ids
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: echo "::notice title=Books::$(python -m action_network.snapshot --show-books | tr '\n' ' ')"
      - name: Build snapshots
        run: python -m action_network.snapshot --out site
      - name: Summarize
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          idx = json.load(open("site/odds/index.json"))
          counts = "; ".join(f"{k}: " + " ".join(str(f["games"]) for f in v["files"]) for k, v in idx["leagues"].items())
          print(f"::notice title=Games per day (from {idx['retrieved_at']})::{counts}")
          errs = {k: v["error"] for k, v in idx["leagues"].items() if v.get("error")}
          if errs:
              print("::warning title=League errors::" + json.dumps(errs).replace("\n", " "))
          PY
          {
            echo "## Odds snapshot"
            echo '```'
            python -c "import json;i=json.load(open('site/odds/index.json'));[print(k, [f['games'] for f in v['files']], v.get('error','')) for k,v in i['leagues'].items()]"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
