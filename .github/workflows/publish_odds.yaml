name: publish odds

on:
  schedule:
    - cron: "*/30 * * * *"   # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-odds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AN_SCOREBOARD_TTL: "900"       # soccer competitions share one fetch per date
      AN_SNAPSHOT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Check sportsbook ids
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python -m action_network.snapshot --show-books
      - name: Build snapshots
        run: python -m action_network.snapshot --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
